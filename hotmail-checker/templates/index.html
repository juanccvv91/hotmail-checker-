<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e17;
            color: #e8edf5;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            background: rgba(17,25,45,0.85);
            border: 1px solid #1a2a44;
            border-radius: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { color: #00d4ff; font-size: 24px; }
        .header h1 i { margin-right: 10px; }
        .header .subtitle { color: #8899b4; font-size: 14px; }
        
        .status-badge {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .status-badge.running { background: #2ed573; color: #0a0e17; }
        .status-badge.stopped { background: #ff4757; color: #fff; }
        .status-badge.error { background: #ffa502; color: #0a0e17; }
        .status-badge .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-badge.running .dot { background: #0a0e17; animation: pulse 1s infinite; }
        .status-badge.stopped .dot { background: #fff; }
        .status-badge.error .dot { background: #0a0e17; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .card {
            background: rgba(17,25,45,0.85);
            border: 1px solid #1a2a44;
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 20px;
        }
        .card-title {
            color: #00d4ff;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title i { font-size: 16px; }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        label {
            display: block;
            color: #8899b4;
            font-size: 13px;
            margin-bottom: 5px;
        }
        
        input[type="text"], select {
            width: 100%;
            background: rgba(10,14,23,0.8);
            border: 1px solid #1a2a44;
            border-radius: 8px;
            color: #e8edf5;
            padding: 10px 14px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #00d4ff;
        }
        select option { background: #0a0e17; }
        
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { background: #00d4ff; color: #0a0e17; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,212,255,0.3); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .btn-success { background: #2ed573; color: #0a0e17; }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(46,213,115,0.3); }
        
        .btn-danger { background: #ff4757; color: #fff; }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,71,87,0.3); }
        .btn-danger:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .btn-warning { background: #ffa502; color: #0a0e17; }
        .btn-warning:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,165,2,0.3); }
        
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: rgba(17,25,45,0.85);
            border: 1px solid #1a2a44;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .stat-number {
            font-size: 28px;
            font-weight: 700;
            display: block;
        }
        .stat-number.green { color: #2ed573; }
        .stat-number.blue { color: #00d4ff; }
        .stat-number.orange { color: #ffa502; }
        .stat-number.red { color: #ff4757; }
        .stat-label {
            font-size: 11px;
            color: #8899b4;
            text-transform: uppercase;
            margin-top: 4px;
        }
        
        .users-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .users-list::-webkit-scrollbar { width: 4px; }
        .users-list::-webkit-scrollbar-track { background: rgba(10,14,23,0.5); }
        .users-list::-webkit-scrollbar-thumb { background: #1a2a44; border-radius: 3px; }
        
        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid #1a2a44;
            border-radius: 6px;
            margin-bottom: 4px;
        }
        .user-item .name { font-weight: 600; }
        .user-item .id { color: #8899b4; font-size: 12px; font-family: monospace; }
        .user-item .commands { color: #00d4ff; font-size: 12px; }
        .user-item .last-seen { color: #8899b4; font-size: 11px; }
        
        .empty-state {
            text-align: center;
            color: #8899b4;
            padding: 30px;
        }
        .empty-state i { font-size: 40px; margin-bottom: 10px; display: block; }
        
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a2a44;
            color: #e8edf5;
            padding: 15px 25px;
            border-radius: 10px;
            border-left: 4px solid #00d4ff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s;
            z-index: 1000;
            max-width: 400px;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-left-color: #2ed573; }
        .toast.error { border-left-color: #ff4757; }
        .toast.warning { border-left-color: #ffa502; }
        
        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: stretch; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <div>
                <h1><i class="fas fa-robot"></i> Bot Manager</h1>
                <span class="subtitle">Controla tu bot de Telegram desde la web</span>
            </div>
            <div style="display:flex;align-items:center;gap:15px;flex-wrap:wrap;">
                <span class="status-badge stopped" id="statusBadge">
                    <span class="dot"></span> <span id="statusText">Detenido</span>
                </span>
                <span style="color:#8899b4;font-size:12px;" id="uptimeText">● Offline</span>
            </div>
        </header>

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-box">
                <span class="stat-number blue" id="statUsers">0</span>
                <span class="stat-label">👥 Usuarios</span>
            </div>
            <div class="stat-box">
                <span class="stat-number green" id="statCommands">0</span>
                <span class="stat-label">📊 Comandos</span>
            </div>
            <div class="stat-box">
                <span class="stat-number orange" id="statUptime">-</span>
                <span class="stat-label">⏱️ Tiempo activo</span>
            </div>
            <div class="stat-box">
                <span class="stat-number red" id="statExpires">-</span>
                <span class="stat-label">⏳ Expira</span>
            </div>
        </div>

        <!-- CONFIGURACIÓN -->
        <div class="card">
            <div class="card-title"><i class="fas fa-cog"></i> Configuración del Bot</div>
            <div class="grid-2">
                <div>
                    <label><i class="fas fa-key"></i> Token del Bot</label>
                    <input type="text" id="tokenInput" placeholder="Token ya configurado" value="8780478988:AAEgEU2q5kLo1vZ5deOkn_U3quhPQVx8dno">
                </div>
                <div>
                    <label><i class="fas fa-clock"></i> Duración</label>
                    <select id="durationSelect">
                        <option value="1h">1 Hora</option>
                        <option value="6h">6 Horas</option>
                        <option value="12h">12 Horas</option>
                        <option value="24h">24 Horas</option>
                        <option value="infinito" selected>♾️ Infinito</option>
                    </select>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-success" id="startBtn" onclick="startBot()"><i class="fas fa-play"></i> Iniciar Bot</button>
                <button class="btn btn-danger" id="stopBtn" onclick="stopBot()" disabled><i class="fas fa-stop"></i> Detener Bot</button>
                <button class="btn btn-warning" onclick="saveConfig()"><i class="fas fa-save"></i> Guardar Configuración</button>
            </div>
        </div>

        <!-- USUARIOS -->
        <div class="card">
            <div class="card-title">
                <i class="fas fa-users"></i> Usuarios Activos
                <span style="margin-left:auto;font-size:12px;color:#8899b4;font-weight:400;" id="userCount">0 usuarios</span>
                <button class="btn btn-sm btn-danger" onclick="clearUsers()" style="margin-left:10px;"><i class="fas fa-trash"></i> Limpiar</button>
            </div>
            <div class="users-list" id="usersList">
                <div class="empty-state">
                    <i class="fas fa-user-slash"></i>
                    <p>No hay usuarios registrados aún.<br>Envía /start al bot para aparecer aquí.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        function showToast(message, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = message;
            el.className = `toast show ${type}`;
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => el.classList.remove('show'), 3000);
        }

        async function loadData() {
            try {
                const configRes = await fetch('/api/config');
                const config = await configRes.json();
                
                document.getElementById('durationSelect').value = config.duration || 'infinito';
                updateStatus(config.status, config.started_at, config.expires_at);
                
                const usersRes = await fetch('/api/users');
                const usersData = await usersRes.json();
                updateUsers(usersData.users, usersData.total_commands);
                
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function updateStatus(status, startedAt, expiresAt) {
            const badge = document.getElementById('statusBadge');
            const text = document.getElementById('statusText');
            const uptime = document.getElementById('statUptime');
            const expires = document.getElementById('statExpires');
            
            badge.className = `status-badge ${status}`;
            
            if (status === 'running') {
                text.textContent = '🟢 En ejecución';
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('uptimeText').textContent = '● Activo';
                document.getElementById('uptimeText').style.color = '#2ed573';
                
                if (startedAt) {
                    const start = new Date(startedAt);
                    const now = new Date();
                    const diff = Math.floor((now - start) / 1000);
                    const hours = Math.floor(diff / 3600);
                    const minutes = Math.floor((diff % 3600) / 60);
                    uptime.textContent = hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
                }
                
                if (expiresAt) {
                    const exp = new Date(expiresAt);
                    const now = new Date();
                    const diff = Math.floor((exp - now) / 1000);
                    if (diff > 0) {
                        const hours = Math.floor(diff / 3600);
                        const minutes = Math.floor((diff % 3600) / 60);
                        expires.textContent = hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
                    } else {
                        expires.textContent = 'Expirado';
                    }
                } else {
                    expires.textContent = '♾️ Infinito';
                }
                
            } else if (status === 'error') {
                text.textContent = '⚠️ Error';
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('uptimeText').textContent = '● Error';
                document.getElementById('uptimeText').style.color = '#ffa502';
                uptime.textContent = '-';
                expires.textContent = '-';
            } else {
                text.textContent = '⏹️ Detenido';
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('uptimeText').textContent = '● Offline';
                document.getElementById('uptimeText').style.color = '#8899b4';
                uptime.textContent = '-';
                expires.textContent = '-';
            }
        }

        function updateUsers(users, totalCommands) {
            const list = document.getElementById('usersList');
            document.getElementById('statUsers').textContent = users.length;
            document.getElementById('statCommands').textContent = totalCommands || 0;
            document.getElementById('userCount').textContent = `${users.length} usuarios`;
            
            if (users.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-user-slash"></i>
                        <p>No hay usuarios registrados aún.<br>Envía /start al bot para aparecer aquí.</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            users.forEach(user => {
                const lastSeen = user.last_seen ? new Date(user.last_seen).toLocaleString() : 'Nunca';
                html += `
                    <div class="user-item">
                        <div>
                            <span class="name">${user.first_name || 'Usuario'}</span>
                            ${user.username ? `@${user.username}` : ''}
                            <span class="id">(${user.id})</span>
                        </div>
                        <div style="display:flex;gap:15px;align-items:center;">
                            <span class="commands">📊 ${user.commands_count || 0}</span>
                            <span class="last-seen">${lastSeen}</span>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        async function saveConfig() {
            const token = document.getElementById('tokenInput').value.trim();
            const duration = document.getElementById('durationSelect').value;
            
            if (!token) {
                showToast('⚠️ Ingresa el token del bot', 'warning');
                return;
            }
            
            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, duration })
                });
                
                const data = await response.json();
                if (data.success) {
                    showToast('✅ Configuración guardada', 'success');
                } else {
                    showToast('❌ Error al guardar', 'error');
                }
            } catch (error) {
                showToast('❌ Error de conexión', 'error');
            }
        }

        async function startBot() {
            await saveConfig();
            
            try {
                const response = await fetch('/api/start', { method: 'POST' });
                const data = await response.json();
                
                if (data.success) {
                    showToast('✅ Bot iniciado correctamente', 'success');
                    setTimeout(loadData, 2000);
                } else {
                    showToast('❌ ' + (data.error || 'Error al iniciar'), 'error');
                }
            } catch (error) {
                showToast('❌ Error de conexión', 'error');
            }
        }

        async function stopBot() {
            try {
                const response = await fetch('/api/stop', { method: 'POST' });
                const data = await response.json();
                
                if (data.success) {
                    showToast('⏹️ Bot detenido', 'warning');
                    loadData();
                }
            } catch (error) {
                showToast('❌ Error de conexión', 'error');
            }
        }

        async function clearUsers() {
            if (!confirm('¿Eliminar historial de usuarios?')) return;
            
            try {
                await fetch('/api/clear_users', { method: 'POST' });
                showToast('🗑️ Historial limpiado', 'warning');
                loadData();
            } catch (error) {
                showToast('❌ Error', 'error');
            }
        }

        setInterval(() => {
            fetch('/api/status')
                .then(res => res.json())
                .then(data => {
                    updateStatus(data.status, data.started_at, data.expires_at);
                })
                .catch(() => {});
        }, 5000);

        loadData();
        showToast('🤖 Panel de control cargado', 'info');
    </script>
</body>
</html>
