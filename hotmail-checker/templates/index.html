<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick Bot Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111927;
            --bg-card: rgba(17, 25, 45, 0.85);
            --border-color: #1a2a44;
            --text-primary: #e8edf5;
            --text-secondary: #8899b4;
            --accent: #00d4ff;
            --success: #2ed573;
            --warning: #ffa502;
            --danger: #ff4757;
            --purple: #a29bfe;
            --pink: #e056a0;
            --gold: #ffd700;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            padding: 15px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), #0088cc);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
        }

        .logo-text h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent), #66e0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text span { font-size: 11px; color: var(--text-secondary); }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.ready { background: var(--text-secondary); }
        .status-dot.running { background: var(--success); animation: pulse 1s infinite; }
        .status-dot.stopped { background: var(--danger); }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            backdrop-filter: blur(20px);
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title i { font-size: 14px; }

        input, select, textarea {
            width: 100%;
            background: rgba(10, 14, 23, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 10px 14px;
            font-size: 13px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .input-group input { flex: 1; }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #0088cc);
            color: #0a0e17;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,212,255,0.3); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-success {
            background: var(--success);
            color: #0a0e17;
        }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(46,213,115,0.3); }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,71,87,0.3); }

        .btn-warning {
            background: var(--warning);
            color: #0a0e17;
        }
        .btn-warning:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,165,2,0.3); }

        .btn-purple {
            background: var(--purple);
            color: #0a0e17;
        }
        .btn-purple:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(162,155,254,0.3); }

        .btn-sm { padding: 6px 14px; font-size: 11px; }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 22px;
            font-weight: 700;
            display: block;
        }
        .stat-label {
            font-size: 9px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-top: 3px;
        }
        .stat-card.viewers .stat-number { color: var(--success); }
        .stat-card.connections .stat-number { color: var(--accent); }
        .stat-card.target .stat-number { color: var(--gold); }
        .stat-card.followers .stat-number { color: var(--purple); }
        .stat-card.live .stat-number { color: var(--danger); }

        .log-container {
            background: rgba(10, 14, 23, 0.9);
            border-radius: 8px;
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.6;
            border: 1px solid var(--border-color);
        }

        .log-container::-webkit-scrollbar { width: 4px; }
        .log-container::-webkit-scrollbar-track { background: rgba(10,14,23,0.5); }
        .log-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        .log-line {
            padding: 2px 0;
            border-bottom: 1px solid rgba(26,42,68,0.15);
            display: flex;
            gap: 8px;
        }

        .log-line .time { color: var(--text-secondary); min-width: 50px; font-size: 10px; }
        .log-line .message { word-break: break-all; }
        .log-line .message.success { color: var(--success); }
        .log-line .message.error { color: var(--danger); }
        .log-line .message.warning { color: var(--warning); }
        .log-line .message.info { color: var(--text-secondary); }

        .channel-info {
            background: rgba(0,212,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }

        .channel-info .label { color: var(--text-secondary); font-size: 11px; }
        .channel-info .value { color: var(--text-primary); font-size: 14px; font-weight: 600; }
        .channel-info .live-tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }
        .channel-info .live-tag.live { background: var(--danger); color: #fff; }
        .channel-info .live-tag.offline { background: var(--text-secondary); color: #fff; }

        .method-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 8px 0;
        }

        .method-selector label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .method-selector label:hover {
            border-color: var(--accent);
            background: rgba(0,212,255,0.05);
        }

        .method-selector input[type="radio"] {
            width: auto;
            accent-color: var(--accent);
        }

        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: stretch; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-bolt"></i></div>
                <div class="logo-text">
                    <h1>Kick Bot Pro</h1>
                    <span>Channel Info + Viewers Injector</span>
                </div>
            </div>
            <div class="status-badge">
                <span class="status-dot ready" id="statusDot"></span>
                <span id="statusText">Ready</span>
            </div>
        </header>

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card viewers"><span class="stat-number" id="statViewers">0</span><span class="stat-label">📊 Viewers Inyectados</span></div>
            <div class="stat-card connections"><span class="stat-number" id="statConnections">0</span><span class="stat-label">🔗 Conexiones Activas</span></div>
            <div class="stat-card target"><span class="stat-number" id="statTarget">0</span><span class="stat-label">🎯 Objetivo</span></div>
            <div class="stat-card followers"><span class="stat-number" id="statFollowers">0</span><span class="stat-label">👥 Seguidores</span></div>
            <div class="stat-card live"><span class="stat-number" id="statLive">⚪</span><span class="stat-label">📡 Estado</span></div>
        </div>

        <!-- MAIN GRID -->
        <div class="grid-2">
            <!-- LEFT COLUMN -->
            <div>
                <!-- CHANNEL INFO -->
                <div class="card" style="margin-bottom:15px;">
                    <div class="card-title"><i class="fas fa-search"></i> Información del Canal</div>
                    <div class="input-group">
                        <input type="text" id="channelInput" placeholder="Nombre del canal (ej: xqc)" value="xqc">
                        <button class="btn btn-primary" onclick="getChannelInfo()"><i class="fas fa-search"></i> Buscar</button>
                    </div>
                    <div id="channelInfoContainer">
                        <div style="color:var(--text-secondary);font-size:12px;text-align:center;padding:10px;">
                            <i class="fas fa-info-circle"></i> Ingresa un canal para ver su información
                        </div>
                    </div>
                </div>

                <!-- VIEWERS INJECTOR -->
                <div class="card">
                    <div class="card-title"><i class="fas fa-rocket"></i> Inyección de Viewers</div>
                    
                    <div class="input-group">
                        <input type="text" id="viewerChannel" placeholder="Canal objetivo" value="xqc">
                        <input type="number" id="viewerCount" placeholder="Cantidad" value="10" min="1" max="10000" style="width:100px;">
                    </div>

                    <div class="method-selector">
                        <label><input type="radio" name="method" value="websocket" checked> WebSocket</label>
                        <label><input type="radio" name="method" value="requests"> HTTP</label>
                        <label><input type="radio" name="method" value="proxy_websocket"> Proxy + WS</label>
                    </div>

                    <div class="btn-group">
                        <button class="btn btn-success" id="startBtn" onclick="startViewers()"><i class="fas fa-play"></i> Iniciar</button>
                        <button class="btn btn-danger" id="stopBtn" onclick="stopViewers()" disabled><i class="fas fa-stop"></i> Detener</button>
                        <button class="btn btn-warning" onclick="clearLogs()"><i class="fas fa-trash-alt"></i> Limpiar Logs</button>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN -->
            <div>
                <!-- LOGS -->
                <div class="card">
                    <div class="card-title"><i class="fas fa-terminal"></i> Logs <span id="logCount" style="font-size:10px;color:var(--text-secondary);">0 entradas</span></div>
                    <div class="log-container" id="logContainer">
                        <div class="log-line">
                            <span class="time">●</span>
                            <span class="message info">Sistema listo para usar</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // STATE
        // ============================================
        let running = false;
        let updateInterval = null;

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const logContainer = document.getElementById('logContainer');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        // ============================================
        // LOGGING
        // ============================================
        function addLog(message, level = 'info') {
            const div = document.createElement('div');
            div.className = 'log-line';
            const time = new Date().toLocaleTimeString();
            div.innerHTML = `<span class="time">${time}</span><span class="message ${level}">${message}</span>`;
            logContainer.prepend(div);
            if (logContainer.children.length > 200) {
                logContainer.removeChild(logContainer.children[logContainer.children.length - 1]);
            }
            document.getElementById('logCount').textContent = logContainer.children.length + ' entradas';
        }

        // ============================================
        // CHANNEL INFO
        // ============================================
        async function getChannelInfo() {
            const channel = document.getElementById('channelInput').value.trim();
            if (!channel) {
                addLog('⚠️ Ingresa un nombre de canal', 'warning');
                return;
            }

            addLog(`🔍 Buscando información de ${channel}...`, 'info');

            try {
                const response = await fetch('/api/channel/info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ channel, method: 'all' })
                });

                const data = await response.json();

                if (!data.success) {
                    addLog(`❌ Error: ${data.error}`, 'error');
                    return;
                }

                // Mostrar resultados
                const container = document.getElementById('channelInfoContainer');
                let html = '';

                data.results.forEach((result, index) => {
                    if (result.success) {
                        const liveTag = result.is_live ? 
                            '<span class="live-tag live">🔴 EN VIVO</span>' : 
                            '<span class="live-tag offline">⚪ OFFLINE</span>';
                        
                        html += `
                            <div class="channel-info" style="margin-top:${index > 0 ? '8px' : '0'};border-left-color:${result.is_live ? 'var(--danger)' : 'var(--text-secondary)'};">
                                <div style="display:flex;justify-content:space-between;flex-wrap:wrap;">
                                    <div>
                                        <span class="label">${result.method}</span><br>
                                        <span class="value">${result.display_name}</span>
                                    </div>
                                    ${liveTag}
                                </div>
                                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin-top:8px;">
                                    <div><span class="label">Seguidores</span><br><span class="value">${result.followers.toLocaleString()}</span></div>
                                    <div><span class="label">Viewers</span><br><span class="value">${result.viewers.toLocaleString()}</span></div>
                                    <div><span class="label">Categoría</span><br><span class="value" style="font-size:12px;">${result.category || 'N/A'}</span></div>
                                </div>
                                ${result.title ? `<div style="margin-top:6px;"><span class="label">Título</span><br><span class="value" style="font-size:13px;">${result.title}</span></div>` : ''}
                            </div>
                        `;

                        // Actualizar stats
                        document.getElementById('statFollowers').textContent = result.followers.toLocaleString();
                        document.getElementById('statLive').textContent = result.is_live ? '🔴 EN VIVO' : '⚪ OFFLINE';
                        document.getElementById('statLive').style.color = result.is_live ? 'var(--danger)' : 'var(--text-secondary)';
                    }
                });

                if (!html) {
                    html = `<div style="color:var(--warning);font-size:12px;text-align:center;padding:10px;">
                        ⚠️ No se pudo obtener información del canal
                    </div>`;
                }

                container.innerHTML = html;
                addLog(`✅ Información de ${channel} obtenida correctamente`, 'success');

            } catch (error) {
                addLog(`❌ Error: ${error.message}`, 'error');
            }
        }

        // ============================================
        // VIEWERS INJECTION
        // ============================================
        async function startViewers() {
            if (running) return;

            const channel = document.getElementById('viewerChannel').value.trim();
            const count = parseInt(document.getElementById('viewerCount').value) || 10;
            const method = document.querySelector('input[name="method"]:checked').value;

            if (!channel) {
                addLog('⚠️ Ingresa un canal objetivo', 'warning');
                return;
            }

            if (count < 1 || count > 10000) {
                addLog('⚠️ La cantidad debe estar entre 1 y 10000', 'warning');
                return;
            }

            running = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            statusDot.className = 'status-dot running';
            statusText.textContent = 'Inyectando...';

            addLog(`🚀 Iniciando inyección en ${channel} (${count} viewers, método: ${method})`, 'info');

            try {
                const response = await fetch('/api/viewers/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ channel, count, method })
                });

                const data = await response.json();

                if (data.error) {
                    addLog(`❌ ${data.error}`, 'error');
                    running = false;
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    statusDot.className = 'status-dot stopped';
                    statusText.textContent = 'Error';
                    return;
                }

                addLog(`✅ Inyección iniciada: ${data.count} viewers en ${data.channel}`, 'success');

                if (updateInterval) clearInterval(updateInterval);
                updateInterval = setInterval(fetchStatus, 2000);

            } catch (error) {
                addLog(`❌ Error: ${error.message}`, 'error');
                running = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                statusDot.className = 'status-dot stopped';
                statusText.textContent = 'Error';
            }
        }

        async function stopViewers() {
            if (!running) return;

            try {
                await fetch('/api/viewers/stop', { method: 'POST' });
                addLog('⏹️ Deteniendo inyección...', 'warning');
            } catch (error) {
                addLog(`❌ Error al detener: ${error.message}`, 'error');
            }
        }

        // ============================================
        // STATUS FETCH
        // ============================================
        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                document.getElementById('statViewers').textContent = data.viewers_injected || 0;
                document.getElementById('statConnections').textContent = data.active_connections || 0;
                document.getElementById('statTarget').textContent = data.target || 0;

                // Actualizar logs si hay nuevos
                if (data.logs && data.logs.length > 0) {
                    data.logs.forEach(log => {
                        // Solo agregar si no existe ya en el DOM
                        const exists = Array.from(logContainer.querySelectorAll('.log-line')).some(
                            el => el.textContent.includes(log.message)
                        );
                        if (!exists) {
                            addLog(log.message, log.level);
                        }
                    });
                }

                if (!data.running && running) {
                    running = false;
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    statusDot.className = 'status-dot stopped';
                    statusText.textContent = 'Completado';
                    if (updateInterval) {
                        clearInterval(updateInterval);
                        updateInterval = null;
                    }
                    addLog('✅ Proceso completado', 'success');
                }

            } catch (error) {
                console.error('Status fetch error:', error);
            }
        }

        // ============================================
        // LOGS
        // ============================================
        async function clearLogs() {
            try {
                await fetch('/api/logs/clear', { method: 'POST' });
                logContainer.innerHTML = '<div class="log-line"><span class="time">●</span><span class="message info">Logs limpiados</span></div>';
                document.getElementById('logCount').textContent = '1 entrada';
                addLog('🗑️ Logs limpiados', 'info');
            } catch (error) {
                addLog(`❌ Error al limpiar logs: ${error.message}`, 'error');
            }
        }

        // ============================================
        // AUTO FETCH
        // ============================================
        setInterval(() => {
            if (!running) {
                fetchStatus();
            }
        }, 5000);

        addLog('🔧 Kick Bot Pro listo', 'info');
        addLog('💡 Busca un canal para ver su información', 'info');
        addLog('🚀 Configura la cantidad y método para inyectar viewers', 'info');
    </script>
</body>
</html>
