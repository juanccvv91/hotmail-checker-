services:
  # ===== SERVICIO 1: WEB (KEEPER) - Mantiene vivo =====
  - type: web
    name: flask-keeper
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT keeper:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONUNBUFFERED
        value: 1
    healthCheckPath: /health
    autoDeploy: true

  # ===== SERVICIO 2: WORKER (BOT) =====
  - type: worker
    name: telegram-bot
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONUNBUFFERED
        value: 1
    autoDeploy: true